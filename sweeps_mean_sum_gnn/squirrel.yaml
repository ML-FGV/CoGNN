project: CoGNN
name: squirrel
program: main.py
method: grid

metric:
  name: val_mean
  goal: maximize

parameters:
  env_num_layers:
    values: [2, 3, 4, 5]
  env_dim:
    values: [32, 64]
  env_model_type:
    values: ["MEAN_GNN", "SUM_GNN"]
  act_num_layers:
    values: [1, 2, 3, 4, 5]
  act_dim:
    values: [32, 64]
  act_model_type:
    values: ["MEAN_GNN", "SUM_GNN"]
  tau0:
    values: [0.0, 0.1]
  lr:
    value: 0.02
  dropout:
    value: 0.5
  max_epochs:
    value: 2500

command:
  - ${env}
  - "python"
  - ${program}
  - "--dataset=squirrel"
  - "--learn_temp"
  - "--skip"
  - "--layer_norm"
  - ${args}

