project: CoGNN_GCN
name: amazon_ratings
program: main.py
method: grid

metric:
  name: val_mean
  goal: maximize

parameters:
  env_num_layers:
    values: [4,9,12]
  env_dim:
    values: [64, 512]
  env_model_type:
    value: MPNN
  act_num_layers:
    values: [1, 2, 3, 4, 5, 6]
  act_dim:
    values: [4, 8, 16, 32]
  act_model_type:
    value: MPNN
  tau0:
    values: [0.0, 0.1]
  lr:
    values: [0.01, 0.001]
  gnn:
    value: gcn
  dropout:
    values: [0.2, 0.5]

command:
  - ${env}
  - "python"
  - ${program}
  - "--dataset=amazon_ratings"
  - "--learn_temp"
  - "--res"
  - "--bn"
  - ${args}

