project: CoGNN_GCN
name: amazon_ratings
program: main.py
method: grid

metric:
  name: val_mean
  goal: maximize

parameters:
  local_layers:
    value: 1
  env_num_layers:
    value: 4
  env_dim:
    value: 512
  env_model_type:
    value: MPNN
  act_num_layers:
    values: [1, 2, 3, 4, 5, 6]
  act_dim:
    values: [4, 8, 16, 32]
  act_model_type:
    value: MPNN
  tau0:
    values: [0.0, 0.1]
  lr:
    value: 0.001
  gnn:
    value: gcn
  dropout:
    value: 0.5
  max_epochs:
    value: 2000

command:
  - ${env}
  - "python"
  - ${program}
  - "--dataset=amazon_ratings"
  - "--learn_temp"
  - "--res"
  - "--bn"
  - ${args}

