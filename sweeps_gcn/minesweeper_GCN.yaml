project: CoGNN_GCN
name: minesweeper
program: main.py
method: grid

metric:
  name: val_mean
  goal: maximize

parameters:
  local_layers:
    value: 1
  env_num_layers:
    value: 12
  env_dim:
    value: 64
  env_model_type:
    value: MPNN
  act_num_layers:
    values: [1, 2, 3]
  act_dim:
    values: [4, 8, 16, 32, 64]
  act_model_type:
    value: MPNN
  tau0:
    values: [0.0, 0.1]
  lr:
    value: 0.01
  gnn:
    value: gcn
  dropout:
    value: 0.2
  max_epochs:
    value: 2000

command:
  - ${env}
  - "python"
  - ${program}
  - "--dataset=minesweeper"
  - "--learn_temp"
  - "--res"
  - "--bn"
  - ${args}

