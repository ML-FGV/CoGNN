project: CoGNN_NSD
name: minesweeper
program: main.py
method: grid

metric:
  name: val_mean
  goal: maximize

parameters:
  d:
    value: 2
  layers:
    value: 1
  env_num_layers:
    value: 8
  env_dim:
    value: 512
  env_model_type:
    value: NSD
  act_num_layers:
    values: [1, 2, 3]
  act_dim:
    values: [4, 8, 16, 32, 64]
  act_model_type:
    value: NSD
  tau0:
    values: [0.0, 0.1]
  lr:
    value: 3e-4
  dropout:
    value: 0.2
  max_epochs:
    value: 2000

command:
  - ${env}
  - "python"
  - ${program}
  - "--dataset=minesweeper"
  - "--learn_temp"
  - "--layer_norm"
  - ${args}

