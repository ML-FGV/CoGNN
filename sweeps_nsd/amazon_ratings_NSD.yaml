project: CoGNN_NSD
name: amazon_ratings
program: main.py
method: grid

metric:
  name: val_mean
  goal: maximize

parameters:
  d:
    value: 4
  layers:
    value: 1
  env_num_layers:
    value: 3
  env_dim:
    value: 256
  env_model_type:
    value: NSD
  act_num_layers:
    values: [1, 2, 3, 4, 5, 6]
  act_dim:
    values: [4, 8, 16, 32]
  act_model_type:
    value: NSD
  tau0:
    values: [0.0, 0.1]
  lr:
    value: 3e-4
  dropout:
    value: 0.2
  max_epochs:
    value: 1000

command:
  - ${env}
  - "python"
  - ${program}
  - "--dataset=amazon_ratings"
  - "--learn_temp"
  - "--layer_norm"
  - ${args}

